name: Build Tweak
on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Theos
        uses: Randomblock1/theos-action@v1

      - name: Build Tweak Package
        run: |
          make package FINALPACKAGE=1
